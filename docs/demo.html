CH.forEach(function(c,k){var b=document.createElement('button');b.className='ch';b.type='button';b.innerHTML='<b><i></i></b>'+c[0];b.onclick=function(){off=c[2];t0=performance.now();draw(off)};ctl.appendChild(b);btn.push(b)});
var pp=document.createElement('button');pp.className='pp';pp.type='button';ctl.appendChild(pp);
function lab(){pp.textContent=playing?'Pause':'Play'}
pp.onclick=function(){if(playing){off=(off+(performance.now()-t0)/1000)%DUR;playing=false}else{t0=performance.now();playing=true}lab()};
var tb=document.createElement('button');tb.className='pp';tb.type='button';tb.setAttribute('aria-label','Toggle colour theme');ctl.appendChild(tb);
function curDark(){var t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function lab2(){tb.textContent=curDark()?'Light':'Dark';tb.setAttribute('aria-pressed',curDark()?'true':'false')}
tb.onclick=function(){document.documentElement.dataset.theme=curDark()?'light':'dark';lab2()};lab2();
function draw(t){render(t);var k=t<9?0:t<12?1:t<17.2?2:t<21.4?3:4;
 btn.forEach(function(b,j){var s=CH[j][2],e=j<4?CH[j+1][2]:DUR;b.classList.toggle('on',j===k);b.firstChild.firstChild.style.width=(j<k?100:j===k?(t-s)/(e-s)*100:0)+'%'});
 if(k!==ci){var first=ci<0;ci=k;if(first){$('h').textContent=TT[k];$('p').textContent=CH[k][1]}else{cap.classList.add('out');setTimeout(function(){$('h').textContent=TT[ci];$('p').textContent=CH[ci][1];cap.classList.remove('out')},190)}}}
function loop(){if(playing)draw((off+(performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)}
lab();draw(off);loop();
})();
</script>
</body>
