name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Asha branches worktrees from history: full clone is mandatory.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Worktree creation and evidence commits fail without an identity.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy
          # dev-env pins: code_search CLI tests execute these optional
          # native tools directly (matches the local venv exactly)
          pip install tree-sitter==0.21.3 tree-sitter-languages==1.10.2 ast-grep-py==0.45.3
          pip install -e .

      # Step 1: static analysis
      - name: Lint (ruff)
        run: ruff check asha/ tests/ benchmarks/run_*.py

      # Step 2: type checking
      - name: Typecheck (mypy)
        run: mypy asha/ tests/

      # Step 3: full suite (worktree + evidence tests need the identity above)
      - name: Test (pytest)
        run: pytest tests/ -v
