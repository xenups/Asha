name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Asha branches worktrees from history: full clone is mandatory.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Worktree creation and evidence commits fail without an identity.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy==2.3.1
          pip install mypy-baseline==0.7.4
          # Feature extras are declared in pyproject.toml ([project.
          # optional-dependencies]); install the full CI profile explicitly.
          pip install -e '.[code-search]'
          pip install -e '.[memory]'
          pip install -e .

      # Step 1: static analysis
      - name: Lint (ruff)
        run: ruff check asha/ tests/ benchmarks/run_*.py

      # Step 2: type checking against the locked 4-diagnostic baseline.
      # `mypy-baseline filter` consumes baseline-matched diagnostics and
      # exits non-zero on ANY new or resolved baseline entry -- identity,
      # not count (see mypy-baseline.txt). Run `mypy ... | mypy-baseline
      # sync` to regenerate the baseline when a baseline error is
      # intentionally fixed.
      - name: Typecheck (mypy, baseline-gated)
        run: mypy asha/ tests/ | mypy-baseline filter

      # Step 3: full suite (worktree + evidence tests need the identity above).
      # Empty collection must FAIL the job, not pass silently: pytest's
      # own exit 5 ("no tests collected") is propagated, and the collected
      # count is asserted explicitly so a runner wrapper that masks exit
      # codes can never make an empty suite look green.
      - name: Test (pytest)
        run: |
          set +e
          pytest tests/ -v > /tmp/pytest.log 2>&1
          status=$?
          set -e
          collected=$(grep -oE '[0-9]+ passed' /tmp/pytest.log | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "pytest_exit=$status collected=$collected"
          tail -40 /tmp/pytest.log
          if [ "$collected" -eq 0 ]; then
            echo "::error::CI collected 0 tests -- empty suite must not pass silently"
            exit 1
          fi
          exit $status
